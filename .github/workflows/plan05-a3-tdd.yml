name: Plan05 A3 TDD

on:
  push:
    branches:
      - codex/plan05-a3-tdd

permissions:
  contents: write

jobs:
  exact-turn-projection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/maintenance-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: extensions/maintenance-api/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply deterministic Ruff import fix
        run: python -m ruff check --fix tests/services/test_business_card_service.py
      - name: Persist deterministic Ruff import fix
        run: |
          if ! git diff --quiet -- tests/services/test_business_card_service.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/services/test_business_card_service.py
            git commit -m "style: apply ruff import ordering"
            git push origin HEAD:codex/plan05-a3-tdd
          fi
      - name: Ruff touched A3 surface
        run: >-
          python -m ruff check
          app/schemas/business_card.py
          app/schemas/business_card_projection.py
          app/services/business_card_service.py
          app/services/ai_session_service.py
          app/repositories/ai_session_repository.py
          app/api/v1/ai/sessions.py
          app/api/v1/ai/business_cards.py
          app/api/v1/ai/router.py
          tests/services/test_business_card_service.py
          tests/api/test_business_card_api.py
      - name: Run A1-A3 and nearby AI regressions
        run: >-
          python -m pytest -q
          tests/services/test_business_card_service.py
          tests/api/test_business_card_api.py
          tests/api/test_ai_session_api.py
          tests/api/test_ai_sessions.py
          tests/api/test_ai_sse.py
          tests/api/test_ai_actor_routes.py
          tests/api/test_ai_routes.py
