[project]
name = "maintenance-api"
version = "0.2.0"
description = "Maintenance support business API"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
