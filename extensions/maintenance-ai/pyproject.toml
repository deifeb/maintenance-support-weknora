[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-ai"
version = "0.1.0"
description = "Provider-neutral AI orchestration core for maintenance support"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.28,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=2.10,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<1.0",
  "respx>=0.22,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
  "external: calls an external model or evidence service",
  "ollama: calls a real local Ollama service",
  "openai_compatible: calls a configured OpenAI-compatible service",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
